aid: onecli
name: Onecli
description: >-
  OneCLI is an open-source credential gateway and identity layer for AI agents.
  Agents connect to Gmail, GitHub, Slack, AWS, Jira and 50+ other services
  through a network-layer proxy that injects real API keys and OAuth tokens at
  request time, so the agent only ever sees placeholder credential stubs and a
  compromised or misbehaving agent can never leak secrets. Teams get per-agent
  access control, policy rules (allow, block, rate-limit, manual approval), a
  built-in encrypted secrets vault, and full audit logs. The REST API manages
  agents, secrets, policy rules, and app connections programmatically; OneCLI
  runs as hosted Cloud or as a self-hosted (Docker) community edition. Founded
  by ex-Argon Security / Aqua Security engineers and backed by Y Combinator;
  licensed Apache-2.0.
