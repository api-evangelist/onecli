              schema:
                type: object
                properties:
                  success:
                    type: boolean
  /agents/granular-access:
    get:
      operationId: listAgentGranularAccess
      summary: List granular-access policies
      description: >
        Read-only overview of every agent → connection assignment in the project
        that carries a non-empty granular-access policy (e.g. GitHub repository
        or Dropbox folder scoping). Unrestricted assignments are omitted.
      tags:
        - Agents
      responses:
        '200':
          description: Granular-access entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    agentId:
                      type: string
                    agentName:
                      type: string
                    connectionId:
                      type: string
                    provider:
                      type: string
                    connectionLabel:
                      type: string
                      nullable: true
                    policy:
                      type: object
                      description: >-
                        Provider-specific session policy (e.g. allowed GitHub
                        repositories or Dropbox folders).
  /agents/{agentId}/connections:
    get:
      operationId: getAgentConnections
      summary: List agent's app-connection assignments
      description: >-
        Returns the agent's app-connection assignments and their per-connection
        granular-access policies.
      tags:
        - Agents
      parameters:
