      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - connections
              properties:
                connections:
                  type: array
                  items:
                    type: object
                    required:
                      - appConnectionId
                    properties:
                      appConnectionId:
                        type: string
                      sessionPolicy:
                        type: object
                        nullable: true
                        description: >-
                          Provider-specific granular-access policy (validated
                          per provider). Omit or null for unrestricted access.
      responses:
        '200':
          description: Assignments updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /secrets:
    get:
      operationId: listSecrets
      summary: List secrets
      description: >-
        Returns all secrets in the current project. Secret values are never
        returned.
      tags:
        - Secrets
      responses:
        '200':
          description: List of secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Secret'
    post:
      operationId: createSecret
      summary: Create a secret
      description: >
        Creates a new secret. The gateway uses secrets to inject credentials
        into outbound requests matching the host and path patterns.


        - **anthropic** and **openai** types are auto-configured.

        - **generic** type requires an `injectionConfig`.

        - Instead of an inline `value`, a project secret can reference a
        1Password field: set `valueSource` to `onepassword` and provide `opRef`.
        The gateway resolves the value at request time via the project's
        1Password vault connection.
      tags:
        - Secrets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
                - hostPattern
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Anthropic Production
                type:
                  type: string
                  enum:
                    - anthropic
                    - openai
                    - generic
                valueSource:
                  type: string
                  enum:
                    - inline
                    - onepassword
                  default: inline
                value:
                  type: string
                  minLength: 1
                  maxLength: 10000
                  description: >-
                    The secret value (API key, token, etc.). Required unless
                    `valueSource` is `onepassword`.
                opRef:
                  type: string
                  description: >-
                    1Password secret reference (`op://vault/item/field`).
                    Required when `valueSource` is `onepassword`.
                opDisplay:
                  type: object
                  description: >-
                    Human-readable labels of the picked 1Password
                    vault/item/field, for display only.
                  properties:
                    vault:
                      type: string
                    item:
                      type: string
                    field:
                      type: string
                hostPattern:
                  type: string
                  description: >-
                    Hostname pattern to match (no `://`, `/`, or spaces). A `*.`
                    wildcard is only allowed as a leading subdomain and must not
                    cover a public suffix.
                  example: api.anthropic.com
                pathPattern:
                  type: string
                  maxLength: 1000
                  description: Optional path pattern to match
                injectionConfig:
                  $ref: '#/components/schemas/InjectionConfig'
      responses:
        '201':
          description: >-
            Secret created. The response contains the core fields (`id`, `name`,
            `type`, `valueSource`, `opRef`, `hostPattern`, `pathPattern`,
            `createdAt`) plus a masked `preview` of inline values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretCreated'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /secrets/{secretId}:
    patch:
      operationId: updateSecret
      summary: Update a secret
      description: >
        Updates one or more fields on a secret. At least one field must be
        provided.


        Set `valueSource` to `onepassword` (with `opRef`) to switch the secret
        to a 1Password-resolved value, or provide `value` to store an inline
        value.
      tags:
        - Secrets
      parameters:
        - $ref: '#/components/parameters/secretId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                valueSource:
                  type: string
                  enum:
                    - inline
                    - onepassword
                value:
                  type: string
                  minLength: 1
                  maxLength: 10000
                opRef:
                  type: string
                  description: >-
                    1Password secret reference (`op://vault/item/field`).
                    Required when `valueSource` is `onepassword`.
                opDisplay:
                  type: object
                  properties:
                    vault:
                      type: string
                    item:
                      type: string
                    field:
                      type: string
                hostPattern:
                  type: string
                pathPattern:
                  type: string
                  nullable: true
                injectionConfig:
                  $ref: '#/components/schemas/InjectionConfig'
      responses:
        '200':
          description: Secret updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Validation error or no fields provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteSecret
      summary: Delete a secret
      tags:
        - Secrets
      parameters:
        - $ref: '#/components/parameters/secretId'
      responses:
        '204':
          description: Secret deleted
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /rules:
    get:
      operationId: listRules
      summary: List policy rules
      description: Returns all policy rules for the current project.
      tags:
        - Rules
      responses:
        '200':
          description: List of rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyRule'
    post:
      operationId: createRule
      summary: Create a policy rule
      description: >
        Creates a new policy rule. Rules control how agents interact with
        external services:


        - **block** — reject matching requests outright.

        - **rate_limit** — allow up to N requests per time window. Requires
        `rateLimit` and `rateLimitWindow`.

        - **manual_approval** — hold matching requests for human approval before
        forwarding.

        - **allow** — explicitly allow matching requests (used to carve
        exceptions in deny mode or shadow a broader rule).
      tags:
        - Rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - hostPattern
                - action
                - enabled
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Block destructive GitHub API calls
                hostPattern:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  example: api.github.com
                pathPattern:
                  type: string
                  maxLength: 1000
                  example: /repos/*/delete
                method:
                  type: string
                  enum:
                    - GET
                    - POST
                    - PUT
                    - PATCH
                    - DELETE
                action:
                  type: string
                  enum:
                    - block
                    - rate_limit
                    - manual_approval
                    - allow
                enabled:
                  type: boolean
                agentId:
                  type: string
                  description: Scope rule to a specific agent (omit for all agents)
                rateLimit:
                  type: integer
                  minimum: 1
                  maximum: 1000000
                  description: Required when action is `rate_limit`
                rateLimitWindow:
                  type: string
                  enum:
                    - minute
                    - hour
                    - day
                  description: Required when action is `rate_limit`
                conditions:
                  type: array
                  maxItems: 10
                  items:
                    $ref: '#/components/schemas/RuleCondition'
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRule'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /rules/{ruleId}:
    get:
      operationId: getRule
      summary: Get a policy rule
      description: Returns a single policy rule by ID.
      tags:
        - Rules
      parameters:
        - $ref: '#/components/parameters/ruleId'
      responses:
        '200':
          description: Rule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRule'
        '404':
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateRule
      summary: Update a policy rule
      description: >-
        Updates one or more fields on a rule. At least one field must be
        provided.
      tags:
        - Rules
      parameters:
        - $ref: '#/components/parameters/ruleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                hostPattern:
                  type: string
                  minLength: 1
                  maxLength: 1000
                pathPattern:
                  type: string
                  nullable: true
                method:
                  type: string
                  nullable: true
                  enum:
                    - GET
                    - POST
                    - PUT
                    - PATCH
                    - DELETE
                action:
                  type: string
                  enum:
                    - block
                    - rate_limit
                    - manual_approval
                    - allow
                enabled:
                  type: boolean
                agentId:
                  type: string
                  nullable: true
                rateLimit:
                  type: integer
                  nullable: true
                  minimum: 1
                  maximum: 1000000
                rateLimitWindow:
                  type: string
                  nullable: true
                  enum:
                    - minute
                    - hour
                    - day
                conditions:
                  type: array
                  nullable: true
                  maxItems: 10
                  items:
                    $ref: '#/components/schemas/RuleCondition'
      responses:
        '200':
          description: Rule updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteRule
      summary: Delete a policy rule
      tags:
        - Rules
      parameters:
        - $ref: '#/components/parameters/ruleId'
      responses:
        '204':
          description: Rule deleted
        '404':
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /rules/permissions/{provider}:
    get:
      operationId: getRulePermissions
      summary: Get app permissions (project)
      description: >
        Returns the layered tool-level permission states for a provider at the
        project scope: `defaults` holds the all-agents states, `byAgent` holds
        per-agent override layers. Tool IDs come from the app's permission
        definition (`GET /apps/{provider}/permission-definition`).
      tags:
        - Rules
      parameters:
        - $ref: '#/components/parameters/provider'
      responses:
        '200':
          description: Layered permission states
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppPermissionStates'
    put:
      operationId: setRulePermissions
      summary: Set app permissions (project)
      description: >
        Updates tool-level permissions for a provider at the project scope.


        Omit `agentId` to write the all-agents defaults. Pass `agentId` to write
        one agent's override layer; there, the `inherit` permission removes the
        agent's override for a tool so it falls back to the all-agents setting.
      tags:
        - Rules
      parameters:
        - $ref: '#/components/parameters/provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - changes
              properties:
                changes:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/ProjectPermissionChange'
                conditions:
                  type: array
                  maxItems: 10
                  items:
                    $ref: '#/components/schemas/RuleCondition'
                agentId:
                  type: string
                  minLength: 1
                  description: >-
                    Target one agent's override layer instead of the all-agents
                    defaults.
      responses:
        '200':
          description: Permissions updated
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Validation error, unknown provider, or unknown tool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /rules/overlap/{provider}:
    get:
      operationId: getRuleOverlap
      summary: Count overlapping custom rules (project)
      description: >-
        Counts custom project rules whose host patterns overlap the app's hosts
        — rules that may interfere with the app's permission settings.
      tags:
        - Rules
      parameters:
        - $ref: '#/components/parameters/provider'
      responses:
        '200':
          description: Overlap count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
  /projects:
    get:
      operationId: listProjects
      summary: List projects
      description: >-
        Returns all projects in the authenticated user's organization. Cloud
        only.
      tags:
        - Projects
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      operationId: createProject
      summary: Create a project
      description: Creates a new project in the organization. Requires admin role.
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 50
                  example: Production
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Project'
                  - type: object
                    properties:
                      apiKey:
                        type: string
                        nullable: true
                        description: >-
                          Project-scoped API key (`oc_…`) for the new project,
                          seeded for the creating user. Save it — it is only
                          returned here.
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A project with this slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /projects/{projectId}:
    get:
      operationId: getProject
      summary: Get a project
      description: Returns a single project by ID.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateProject
      summary: Update a project
      description: Updates a project's name and slug. Requires admin role.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 50
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A project with this slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteProject
      summary: Delete a project
      description: >
        Permanently deletes a project and all its data (agents, secrets,
        connections, rules, audit logs). Requires admin role. Cannot delete the
        last project in the organization.
      tags:
        - Projects
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '204':
          description: Project deleted
        '400':
          description: Cannot delete the only project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /team/provisions:
    post:
      operationId: provisionUser
      summary: Provision a team member
      description: >
        Pre-creates a user account with its own project, a usable API key, a
        default

        agent, and a claim link. The API key works immediately, so agents can
        make

        requests before the user signs up. The user later opens the claim link
        to bind

        the account to their identity. Unclaimed provisions expire after 7 days
        and are

        cleaned up automatically.


        Requires an admin or owner role. Cloud only.
      tags:
        - Team
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                    - admin
                    - member
                  default: member
                  description: Role the provisioned user will have in the organization.
                skipOnboarding:
                  type: boolean
                  default: true
                  description: Whether the user skips the onboarding wizard after claiming.
      responses:
        '201':
          description: User provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionResult'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions (requires admin or owner)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /user:
    get:
      operationId: getUser
      summary: Get current user
      description: Returns the profile of the authenticated user.
      tags:
        - User
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      operationId: updateUser
      summary: Update user profile
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  name:
                    type: string
  /user/api-key:
    get:
      operationId: getApiKey
      summary: Get API key
      description: >-
        Returns the current API key for the authenticated user in the current
        project.
      tags:
        - User
      responses:
        '200':
          description: API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    type: string
  /user/api-key/regenerate:
    post:
      operationId: regenerateApiKey
      summary: Regenerate API key
      description: Generates a new API key, immediately invalidating the previous one.
      tags:
        - User
      responses:
        '200':
          description: New API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    type: string
  /apps:
    get:
      operationId: listApps
      summary: List apps
      description: >-
        Returns all available apps with their current configuration and
        connection status.
      tags:
        - Apps
      responses:
        '200':
          description: List of apps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/App'
  /apps/{provider}:
    get:
      operationId: getApp
      summary: Get app details
      description: >-
        Returns detailed information about a specific app, including setup
        instructions.
      tags:
        - Apps
      parameters:
        - $ref: '#/components/parameters/provider'
      responses:
        '200':
          description: App details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/App'
                  - type: object
                    properties:
                      hint:
                        type: string
                        description: Setup instructions or guidance
        '404':
          description: Unknown provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /apps/{provider}/authorize:
    get:
      operationId: authorizeApp
      summary: Start OAuth flow
      description: >
        Redirects the user to the app's OAuth authorization page. After the user
        authorizes, they are redirected back to the callback URL.


        This endpoint is typically opened in a browser, not called from code.
      tags:
        - Apps
      parameters:
        - $ref: '#/components/parameters/provider'
        - name: connectionId
          in: query
          schema:
            type: string
          description: Reconnect an existing connection instead of creating a new one
        - name: agent_name
          in: query
          schema:
            type: string
          description: Agent name to associate with the connection
      responses:
        '302':
          description: Redirect to OAuth provider
        '400':
          description: Provider not available or not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /apps/{provider}/connect:
    post:
      operationId: connectApp
      summary: Connect app with credentials
      description: >-
        Connects an app using direct credentials (API key, service account,
        etc.) rather than OAuth.
      tags:
        - Apps
      parameters:
        - $ref: '#/components/parameters/provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fields
              properties:
                fields:
                  type: object
                  additionalProperties:
                    type: string
                  description: Credential fields required by the app
                  example:
                    apiKey: sk-...
                connectionId:
                  type: string
                  description: Reconnect an existing connection
                label:
                  type: string
                  description: >-
                    Display label for the connection. Defaults to a label
                    derived from the credential metadata.
                method:
                  type: string
                  description: >-
                    Connection method to use for apps with multiple methods
                    (e.g. OAuth primary + API-key alternate). An unrecognized
                    value is rejected.
      responses:
        '200':
          description: Connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Validation error or provider not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /connections:
    get:
      operationId: listConnections
      summary: List connections
      description: >-
        Returns the project's app connections (including inherited organization
        connections) as a bare array. Filter with the `provider` query
        parameter.
      tags:
        - Connections
      parameters:
        - $ref: '#/components/parameters/providerQuery'
      responses:
        '200':
          description: List of connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppConnection'
  /connections/{connectionId}:
    patch:
      operationId: renameConnection
      summary: Rename a connection
      description: Sets the display label of an app connection.
      tags:
        - Connections
      parameters:
        - $ref: '#/components/parameters/connectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Connection renamed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  provider:
                    type: string
                  status:
                    type: string
                  label:
                    type: string
                    nullable: true
        '400':
          description: Label is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Connection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: disconnectConnection
      summary: Disconnect a connection
      description: Permanently removes an app connection by ID.
      tags:
        - Connections
      parameters:
        - $ref: '#/components/parameters/connectionId'
      responses:
        '204':
          description: Connection removed
        '404':
          description: Connection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /apps/{provider}/config:
    get:
      operationId: getAppConfig
      summary: Get app configuration
      description: >-
        Returns the non-secret configuration for a BYOC (Bring Your Own
        Credentials) app.
      tags:
        - Apps
      parameters:
        - $ref: '#/components/parameters/provider'
      responses:
        '200':
          description: App configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    additionalProperties:
                      type: string
                  hasCredentials:
                    type: boolean
                  enabled:
                    type: boolean
    post:
      operationId: upsertAppConfig
      summary: Set app configuration
      description: >
        Creates or updates the BYOC configuration for an app. Existing
        connections may be disconnected when credentials change.


        The accepted field names are defined per app (e.g.
        `clientId`/`clientSecret` for OAuth apps; `appId`/`appSlug`/`privateKey`
        for `github-app`). Unknown keys are stripped.
      tags:
        - Apps
      parameters:
        - $ref: '#/components/parameters/provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
              description: Credential fields as defined by the app's configuration schema.
              example:
                clientId: 1234567890.apps.googleusercontent.com
                clientSecret: GOCSPX-…
      responses:
        '201':
          description: Configuration saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Provider does not support configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteAppConfig
      summary: Delete app configuration
      tags:
        - Apps
      parameters:
        - $ref: '#/components/parameters/provider'
      responses:
        '204':
          description: Configuration deleted
  /apps/{provider}/config/toggle:
    patch:
      operationId: toggleAppConfig
      summary: Toggle app configuration
      description: >-
        Enables or disables a provider's BYOC configuration in the current
        project.
      tags:
        - Apps
      parameters:
        - $ref: '#/components/parameters/provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Configuration toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          description: Configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /apps/configured:
    get:
      operationId: listConfiguredApps
      summary: List configured providers
      description: >-
        Returns provider IDs with an enabled BYOC configuration in the current
        project.
      tags:
        - Apps
      responses:
        '200':
          description: List of configured provider IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /apps/env-defaults:
    get:
      operationId: listEnvDefaultApps
      summary: List providers with platform default credentials
      description: >-
        Returns provider IDs whose OAuth credentials are supplied by the
        deployment's environment, so they work without BYOC configuration.
      tags:
        - Apps
      responses:
        '200':
          description: List of provider IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /apps/permission-definitions:
    get:
      operationId: listPermissionDefinitions
      summary: List app permission definitions
      description: >
        Returns the tool catalog of every app that has one — the read/write
        groups and tool IDs that the permissions endpoints operate on. Global
        data; works without a project context, so organization keys can call it
        without `X-Project-Id`.
      tags:
        - Apps
      responses:
        '200':
          description: Permission definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionDefinition'
  /apps/{provider}/permission-definition:
    get:
      operationId: getPermissionDefinition
      summary: Get app permission definition
      description: >
        Returns the app's static tool catalog — the read/write groups and tool
        IDs that the permissions endpoints (`/rules/permissions/{provider}` and
        `/org/rules/permissions/{provider}`) operate on. Global data; works
        without a project context, so organization keys can call it without
        `X-Project-Id`.
      tags:
        - Apps
      parameters:
        - $ref: '#/components/parameters/provider'
      responses:
        '200':
          description: Permission definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDefinition'
        '404':
          description: Unknown provider or no permission definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /apps/{provider}/blocklist:
    get:
      operationId: getBlocklist
      summary: Get blocklist state
      description: >-
        Returns the blocklist state for a provider — the app's predefined hosts
        (with their activation state) and any custom rules.
      tags:
        - Apps
      parameters:
        - $ref: '#/components/parameters/provider'
      responses:
        '200':
          description: Blocklist state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlocklistHostState'
        '404':
          description: Unknown provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: addBlocklistEntry
      summary: Activate or add a blocklist entry
      description: >
        Provide either `{ hostId }` to activate one of the app's predefined
        blocklist hosts, or `{ name, hostPattern }` to add a custom blocklist
        rule.
      tags:
        - Apps
      parameters:
        - $ref: '#/components/parameters/provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: Activate predefined host
                  required:
                    - hostId
                  properties:
                    hostId:
                      type: string
                - type: object
                  title: Add custom rule
                  required:
                    - name
                    - hostPattern
                  properties:
                    name:
                      type: string
                    hostPattern:
                      type: string
      responses:
        '201':
          description: Blocklist entry created or activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlocklistHostState'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /apps/{provider}/blocklist/{ruleId}:
    patch:
      operationId: toggleBlocklistRule
      summary: Toggle a blocklist rule
      tags:
        - Apps
      parameters:
        - $ref: '#/components/parameters/provider'
        - $ref: '#/components/parameters/blocklistRuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Rule toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
    delete:
      operationId: removeBlocklistRule
      summary: Remove a blocklist rule
      tags:
        - Apps
      parameters:
        - $ref: '#/components/parameters/provider'
        - $ref: '#/components/parameters/blocklistRuleId'
      responses:
        '204':
          description: Rule removed
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Returns the API's status and version. No authentication required.
      security: []
      tags:
        - Utility
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
  /counts:
    get:
      operationId: getCounts
      summary: Get resource counts
      description: Returns the current project's resource totals.
      tags:
        - Utility
      responses:
        '200':
          description: Resource counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCounts'
  /vaults:
    get:
      operationId: listVaults
      summary: List vault connections
      description: >-
        Returns the project's external vault connections (e.g. 1Password). Vault
        pairing and disconnect are performed on the gateway process, not this
        API.
      tags:
        - Utility
      responses:
        '200':
          description: List of vault connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VaultConnection'
  /container-config:
    get:
      operationId: getContainerConfig
      summary: Get container configuration
      description: >
        Returns everything an agent orchestrator needs to route a container (or
        local process) through the OneCLI gateway: proxy environment variables,
        the gateway CA certificate, and any credential stub files. The server
        controls all env var names, values, and paths.
      tags:
        - Agent Setup
      parameters:
        - name: agent
          in: query
          required: false
          schema:
            type: string
          description: >-
            Agent identifier. Omit to use the project's default agent (created
            on demand).
      responses:
        '200':
          description: Container configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  env:
                    type: object
                    additionalProperties:
                      type: string
                    description: >-
                      Environment variables to set (proxy URLs, CA trust,
                      credential placeholders).
                  caCertificate:
                    type: string
                    description: PEM-encoded gateway CA certificate.
                  caCertificateContainerPath:
                    type: string
                  credentialStubs:
                    type: array
                    description: >-
                      Present when the agent needs local credential stub files
                      (e.g. Codex OAuth).
                    items:
                      type: object
                      properties:
                        containerPath:
                          type: string
                        content:
                          type: string
                  warnings:
                    type: array
                    items:
                      type: string
        '404':
          description: 'No agent with the given identifier exists (`code: AGENT_NOT_FOUND`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: CA certificate not available (gateway not started yet)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /credential-stubs:
    get:
      operationId: listCredentialStubs
      summary: List credential stub agents
      description: Returns the agent frameworks that have credential stubs available.
      tags:
        - Agent Setup
      responses:
        '200':
          description: Available agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      type: string
                    example:
                      - codex
  /credential-stubs/{agent}:
    get:
      operationId: getCredentialStub
      summary: Get a credential stub
      description: >-
        Returns a placeholder credential file for the given agent framework
        (currently `codex`). The gateway injects real credentials at request
        time.
      tags:
        - Agent Setup
      parameters:
        - name: agent
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credential stub
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent:
                    type: string
                  filePath:
                    type: string
                    example: ~/.codex/auth.json
                  content:
                    type: string
                  authMode:
                    type: string
                    enum:
                      - api-key
                      - oauth
                  permissions:
                    type: string
                    example: '0600'
        '404':
          description: No credential stub for this agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /skill/gateway:
    get:
      operationId: getGatewaySkill
      summary: Get the gateway skill
      description: >-
        Returns the gateway skill as Markdown — instructions that teach a coding
        agent how to work behind the OneCLI gateway. Pass `agent_framework` for
        framework-specific content.
      tags:
        - Agent Setup
      parameters:
        - name: agent_framework
          in: query
          required: false
          schema:
            type: string
          description: Agent framework name (e.g. `claude`, `codex`).
      responses:
        '200':
          description: Skill content
          content:
            text/markdown:
              schema:
                type: string
  /migrate/export:
    post:
      operationId: migrateExport
      summary: Export data to OneCLI Cloud
      description: >
        Exports the current self-hosted instance's data (secrets, agents,
        agent-secret assignments, rules) directly to OneCLI Cloud over HTTPS.
        Secrets are decrypted server-side and transmitted to Cloud; plaintext
        never reaches the caller.


        Only available on self-hosted instances — Cloud returns 404.
      tags:
        - Migration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cloudApiKey
              properties:
                cloudApiKey:
                  type: string
                  description: OneCLI Cloud API key to import into.
                cloudUrl:
                  type: string
                  format: uri
                  description: >-
                    Override the Cloud API URL (default:
                    `https://api.onecli.sh`).
      responses:
        '200':
          description: Migration result
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: object
                    properties:
                      secrets:
                        type: integer
                      agents:
                        type: integer
                      agentSecrets:
                        type: integer
                      rules:
                        type: integer
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        name:
                          type: string
                        reason:
                          type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /approvals/pending:
    get:
      operationId: listPendingApprovals
      summary: List pending approvals
      description: >
        Long-polls for manual-approval requests awaiting a decision in the
        current project. Returns immediately when any are pending, otherwise
        holds the connection open (up to `timeoutSeconds`) until one arrives or
        the poll times out.


        Authenticate with a project API key, or an organization key plus an
        `X-Project-Id` header. Submit each decision to `POST
        /approvals/{id}/decision`.
      tags:
        - Approvals
      parameters:
        - name: exclude
          in: query
          required: false
          schema:
            type: string
          description: >-
            Comma-separated approval IDs to skip (already being handled) so the
            poll can hold open for genuinely new requests.
      responses:
        '200':
          description: Pending approval requests in the project
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/PendingApproval'
                  timeoutSeconds:
                    type: integer
                    description: How long the server holds the long-poll open, in seconds.
        '401':
          description: >-
            No project context (send an `X-Project-Id` header with an
            organization key, or use a project key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /approvals/{id}/decision:
    post:
      operationId: submitApprovalDecision
      summary: Submit an approval decision
      description: >
        Approve or deny a pending manual-approval request. Approving forwards
        the held request to its upstream service; denying blocks it. Scope the
        call to the request's project with a project API key or an
        `X-Project-Id` header.
      tags:
        - Approvals
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The approval ID from `GET /approvals/pending`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum:
                    - approve
                    - deny
                  description: >-
                    Whether to forward the held request (`approve`) or block it
                    (`deny`).
      responses:
        '200':
          description: Decision recorded and the held request released
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          description: No pending approval with that ID in this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: >-
            The approval expired before the decision was submitted (it was
            auto-denied)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /org/approvals/pending:
    get:
      operationId: listOrgPendingApprovals
      summary: List pending approvals across the organization
      description: >
        Long-polls for manual-approval requests awaiting a decision across
        **every** project in the organization. Returns immediately when any are
        pending, otherwise holds the connection open (up to `timeoutSeconds`)
        until one arrives or the poll times out.


        Each request carries its own `projectId`; submit the decision to the
        existing `POST /approvals/{id}/decision` route with that project's
        `X-Project-Id`. Authenticate with an organization API key (`oc_org_...`)
        — the poll itself sends no `X-Project-Id`. Requires the admin or owner
        role. Available on OneCLI Cloud and self-hosted Enterprise.
      tags:
        - Organization Approvals
      parameters:
        - name: exclude
          in: query
          required: false
          schema:
            type: string
          description: >-
            Comma-separated approval IDs to skip (already being handled) so the
            poll can hold open for genuinely new requests.
      responses:
        '200':
          description: Pending approval requests across the organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/PendingApproval'
                  timeoutSeconds:
                    type: integer
                    description: How long the server holds the long-poll open, in seconds.
        '403':
          description: >-
            Insufficient permissions (requires an organization API key with the
            admin or owner role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /org/secrets:
    get:
      operationId: listOrgSecrets
      summary: List organization secrets
      description: >-
        Returns all secrets scoped to the organization. Secret values are never
        returned. Available on OneCLI Cloud and self-hosted Enterprise. Requires
        the admin or owner role.
      tags:
        - Organization Secrets
      responses:
        '200':
          description: List of organization secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Secret'
    post:
      operationId: createOrgSecret
      summary: Create an organization secret
      description: >
        Creates a new secret at the organization level. Organization secrets
        apply across all projects. Requires admin role. Available on OneCLI
        Cloud and self-hosted Enterprise.


        1Password-sourced values (`valueSource: onepassword`) are project-only
        and rejected here — organization secrets must carry an inline `value`.
      tags:
        - Organization Secrets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
                - value
                - hostPattern
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Shared Anthropic Key
                type:
                  type: string
                  enum:
                    - anthropic
                    - openai
                    - generic
                value:
                  type: string
                  minLength: 1
                  maxLength: 10000
                  description: The secret value (API key, token, etc.)
                hostPattern:
                  type: string
                  description: Hostname pattern to match
                  example: api.anthropic.com
                pathPattern:
                  type: string
                  maxLength: 1000
                injectionConfig:
                  $ref: '#/components/schemas/InjectionConfig'
      responses:
        '201':
          description: Secret created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretCreated'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions (requires admin role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /org/secrets/{secretId}:
    patch:
      operationId: updateOrgSecret
