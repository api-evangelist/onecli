      responses:
        '200':
          description: App-connection assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    appConnectionId:
                      type: string
                    sessionPolicy:
                      type: object
                      nullable: true
                      description: >-
                        Provider-specific granular-access policy, or null for
                        unrestricted access.
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateAgentConnections
      summary: Update agent's app-connection assignments
      description: >-
        Replaces the agent's app-connection assignments and their
        granular-access policies.
      tags:
