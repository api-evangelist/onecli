openapi: 3.1.0
info:
  title: OneCLI API
  version: '1.0'
  description: >
    The OneCLI API lets you manage agents, secrets, policy rules, app
    connections, and user settings programmatically.


    **Base URL:** `https://api.onecli.sh/v1` (Cloud) or
    `http://localhost:10254/v1` (self-hosted)


    ## Authentication


    All endpoints require authentication via one of:


    - **API Key** — `Authorization: Bearer <key>` header. Generate keys in the
    dashboard or via `GET /v1/user/api-key`.

    - **Session** — Cookie-based session from the web dashboard.


    For organization-scoped API keys, include the `X-Project-Id` header to
    specify which project to operate on.
servers:
  - url: https://api.onecli.sh/v1
    description: OneCLI Cloud
  - url: http://localhost:10254/v1
    description: Self-hosted (Docker)
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key obtained from the dashboard or `GET /user/api-key`
  schemas:
    Error:
      description: |
        Error responses take one of two shapes depending on the failing layer:
        route-level validation returns the flat shape (`{ "error": "..." }`),
        while authentication failures (401/403) and service errors (not-found,
        conflict, and service-level validation) return the envelope
        (`{ "error": { "message": "...", "type": "..." } }`).
      oneOf:
        - $ref: '#/components/schemas/ErrorFlat'
        - $ref: '#/components/schemas/ErrorEnvelope'
    ErrorFlat:
      type: object
      description: Flat error shape used by route-level validation.
      properties:
        error:
          type: string
      required:
        - error
    ErrorEnvelope:
      type: object
      description: >-
        Envelope error shape used for authentication failures and service
        errors.
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
              description: Error category (e.g. `authentication_error`).
    SecretCreated:
      type: object
      description: The narrowed secret representation returned by create endpoints.
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        valueSource:
          type: string
          enum:
            - inline
            - onepassword
        opRef:
          type: string
        hostPattern:
          type: string
        pathPattern:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        preview:
          type: string
          description: Masked preview of the value (inline secrets only).
    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        identifier:
          type: string
        accessToken:
          type: string
          description: >-
            The agent's gateway access token (`aoc_…`). Returned by `GET
            /agents` and `GET /agents/default`; not included in the `POST
            /agents` response — read it from the list or regenerate it.
        isDefault:
          type: boolean
        secretMode:
          type: string
          enum:
            - all
            - selective
        createdAt:
          type: string
          format: date-time
        _count:
          type: object
          properties:
            agentSecrets:
              type: integer
            agentAppConnections:
              type: integer
    PendingApproval:
      type: object
      description: >-
        A manual-approval request awaiting a decision, tagged with the project
        it belongs to.
      properties:
        id:
          type: string
          description: >-
            Unique approval ID. Pass to `POST /approvals/{id}/decision` to
            decide it.
        projectId:
          type: string
          description: >-
            The project this request belongs to. Send it as `X-Project-Id` when
            submitting the decision.
        method:
          type: string
          description: HTTP method of the held request (e.g. `POST`).
        url:
          type: string
          description: Full URL of the held request.
        host:
          type: string
        path:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
          description: Sanitized request headers (auth headers removed).
        bodyPreview:
          type: string
          nullable: true
          description: >-
            Human-readable, length-bounded rendering of the request body — safe
            to display directly.
        summary:
          type: object
          nullable: true
          description: >-
            Structured form of `bodyPreview` for richer rendering (an `action`
            label plus key/value `details`).
        agent:
          type: object
          description: The agent that made the request.
          properties:
            id:
              type: string
            name:
              type: string
            externalId:
              type: string
              nullable: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Secret:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - anthropic
            - openai
            - generic
        valueSource:
          type: string
          enum:
            - inline
            - onepassword
          description: >-
            Where the secret value lives — stored encrypted (`inline`) or
            resolved from 1Password at request time (`onepassword`).
        opRef:
          type: string
          nullable: true
          description: >-
            1Password secret reference (`op://vault/item/field`). Only set when
            `valueSource` is `onepassword`.
        hostPattern:
          type: string
        pathPattern:
          type: string
          nullable: true
        injectionConfig:
          $ref: '#/components/schemas/InjectionConfig'
        metadata:
          type: object
          nullable: true
          description: >-
            Type-specific metadata (e.g. `authMode` for `anthropic`/`openai`
            secrets, 1Password display labels).
        scope:
          type: string
          enum:
            - project
            - organization
          description: >-
            Project lists include inherited organization secrets; use this to
            tell them apart.
        typeLabel:
          type: string
        createdAt:
          type: string
          format: date-time
    InjectionConfig:
      nullable: true
      description: >
        How the gateway injects this secret into matching outbound requests
        (generic secrets only). Exactly one variant:


        - **Header** — `{ "headerName": "Authorization", "valueFormat": "Bearer
        {value}" }`

        - **Query parameter** — `{ "paramName": "key", "paramFormat": "{value}"
        }`

        - **URL path template** — `{ "pathTemplate": "/bot{value}" }` (must
        start with `/` and contain `{value}` exactly once)

        - **URL path regex** — `{ "pathRegex": "^/bot([^/]+)",
        "pathReplacement": "/bot{value}" }` (replacement must contain `{value}`)


        Unknown or mixed keys are rejected.
      oneOf:
        - type: object
          title: Header injection
          required:
            - headerName
          properties:
            headerName:
              type: string
              minLength: 1
            valueFormat:
              type: string
              description: >-
                Value template; `{value}` is replaced with the secret (default:
                `{value}`).
          additionalProperties: false
        - type: object
          title: Query parameter injection
          required:
            - paramName
          properties:
            paramName:
              type: string
              minLength: 1
            paramFormat:
              type: string
              description: >-
                Value template; `{value}` is replaced with the secret (default:
                `{value}`).
          additionalProperties: false
        - type: object
          title: URL path template injection
          required:
            - pathTemplate
          properties:
            pathTemplate:
              type: string
              description: >-
                Path with a `{value}` hole, e.g. `/bot{value}`. Must start with
                `/` and contain `{value}` exactly once.
          additionalProperties: false
        - type: object
          title: URL path regex injection
          required:
            - pathRegex
            - pathReplacement
          properties:
            pathRegex:
              type: string
              description: Regular expression matched against the request path.
            pathReplacement:
              type: string
              description: >-
                Replacement with `$N` capture references and a `{value}` token
                for the secret.
          additionalProperties: false
    PolicyRule:
      type: object
      description: >-
        A policy rule. Custom (user-authored) rules carry their endpoint fields
        (`hostPattern`/`pathPattern`/`method`); app-permission rules
        (`metadata.source: app_permission`) omit them and are identified by
        `metadata.provider` + `metadata.toolId`.
      properties:
        id:
          type: string
        name:
          type: string
        hostPattern:
          type: string
          description: Custom rules only; absent on app-permission rules.
        pathPattern:
          type: string
          nullable: true
          description: Custom rules only; absent on app-permission rules.
        method:
          type: string
          nullable: true
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - null
          description: Custom rules only; absent on app-permission rules.
        action:
          type: string
          enum:
            - block
            - rate_limit
            - manual_approval
            - allow
        enabled:
          type: boolean
        agentId:
          type: string
          nullable: true
        rateLimit:
          type: integer
          nullable: true
        rateLimitWindow:
          type: string
          nullable: true
          enum:
            - minute
            - hour
            - day
            - null
        scope:
          type: string
          enum:
            - project
            - organization
          description: >-
            Project lists include inherited organization rules; use this to tell
            them apart.
        metadata:
          type: object
          nullable: true
          description: >-
            Set on rules generated by app permissions (`source: app_permission`,
            plus `provider` and `toolId`). Null for custom rules.
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/RuleCondition'
        createdAt:
          type: string
          format: date-time
    RuleCondition:
      type: object
      description: >-
        A condition that must match for the rule to apply. Conditions inspect
        the request body to enable fine-grained filtering beyond
        host/path/method.
      required:
        - target
        - operator
        - value
      properties:
        target:
          type: string
          enum:
            - body
          description: What part of the request to inspect.
        operator:
          type: string
          enum:
            - contains
          description: How to match the value against the target.
        value:
          type: string
          minLength: 1
          maxLength: 1000
          description: The string to match against.
        key:
          type: string
          maxLength: 500
          description: Optional JSON key path within the body to scope the match.
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        createdAt:
          type: string
          format: date-time
    App:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        available:
          type: boolean
        connectionType:
          type: string
          enum:
            - oauth
            - credentials_import
            - api_key
            - cloud_only
        configurable:
          type: boolean
        config:
          type: object
          nullable: true
          properties:
            hasCredentials:
              type: boolean
            enabled:
              type: boolean
        connections:
          type: array
          description: All of the provider's connections in the current project.
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
                nullable: true
              status:
                type: string
              scopes:
                type: array
                items:
                  type: string
              connectedAt:
                type: string
                format: date-time
        credentialStubs:
          type: array
          description: >-
            Local credential stub files some MCP servers need before they can
            start (secrets replaced with `onecli-managed` placeholders).
          items:
            type: object
            properties:
              path:
                type: string
                description: >-
                  Full destination path (e.g.
                  `~/.config/gcloud/application_default_credentials.json`).
              content:
                type: object
                description: Stub file content with `onecli-managed` sentinel values.
    AppConnection:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
        label:
          type: string
          nullable: true
          description: Display label extracted from metadata (e.g., email address)
        status:
          type: string
        scopes:
          type: array
          items:
            type: string
        scope:
          type: string
          enum:
            - project
            - organization
          description: >-
            Project lists include inherited organization connections; use this
            to tell them apart.
        metadata:
          type: object
          nullable: true
          description: >-
            Provider metadata captured at connect time (e.g. account email or
            username).
        connectedAt:
          type: string
          format: date-time
    PermissionState:
      type: object
      properties:
        permission:
          type: string
          enum:
            - allow
            - manual_approval
            - block
        conditions:
          type: array
          items:
            type: object
    AppPermissionStates:
      type: object
      description: Layered app-permission states for a provider.
      properties:
        defaults:
          type: object
          description: Tool states from the all-agents layer (tool ID → state).
          additionalProperties:
            $ref: '#/components/schemas/PermissionState'
        byAgent:
          type: object
          description: >-
            Per-agent override layers (agent ID → tool ID → state). Always empty
            at the organization scope, where rules are agent-less.
          additionalProperties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/PermissionState'
    PermissionChange:
      type: object
      required:
        - toolId
        - permission
      properties:
        toolId:
          type: string
          minLength: 1
        permission:
          type: string
          enum:
            - allow
            - manual_approval
            - block
    ProjectPermissionChange:
      type: object
      required:
        - toolId
        - permission
      properties:
        toolId:
          type: string
          minLength: 1
        permission:
          type: string
          enum:
            - allow
            - manual_approval
            - block
            - inherit
          description: >-
            `inherit` is only valid together with `agentId`: it removes the
            agent's override so the tool falls back to the all-agents setting.
    AppTool:
      type: object
      description: >-
        One operation in an app's permission catalog, by identity. The endpoint
        mapping behind a tool is internal; permission changes reference the tool
        ID and the server resolves the rest.
      properties:
        id:
          type: string
          description: The tool ID that permission changes reference.
        name:
          type: string
        description:
          type: string
    AppToolGroup:
      type: object
      properties:
        category:
          type: string
          enum:
            - read
            - write
        tools:
          type: array
          items:
            $ref: '#/components/schemas/AppTool'
        wildcard:
          $ref: '#/components/schemas/AppTool'
          description: >-
            Optional wildcard tool covering the whole group ("all read/write
            operations").
    PermissionDefinition:
      type: object
      description: >-
        An app's static tool catalog — the tool IDs that the permissions
        endpoints operate on.
      properties:
        provider:
          type: string
        groups:
          type: array
          items:
            $ref: '#/components/schemas/AppToolGroup'
    BlocklistHostState:
      type: object
      description: State of one blocklist entry — a predefined host or a custom rule.
      properties:
        hostId:
          type: string
        ruleId:
          type: string
          nullable: true
          description: >-
            The backing rule ID, or null when a predefined host has never been
            activated.
        enabled:
          type: boolean
        custom:
          type: boolean
          description: True for custom rules, false for the app's predefined hosts.
        name:
          type: string
        hostPattern:
          type: string
        scope:
          type: string
          nullable: true
          enum:
            - project
            - organization
            - null
    VaultConnection:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
          description: External vault provider (e.g. `onepassword`).
        status:
          type: string
        name:
          type: string
          nullable: true
        lastConnectedAt:
          type: string
          format: date-time
          nullable: true
    ResourceCounts:
      type: object
      properties:
        agents:
          type: integer
        apps:
          type: integer
          description: >-
            Connected app connections (including inherited organization
            connections).
        llms:
          type: integer
          description: Non-generic secrets (LLM keys).
        secrets:
          type: integer
          description: Generic secrets.
    PartnerOrg:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - unclaimed
            - claimed
            - detached
          description: >-
            Whether the organization has been claimed by a customer, or detached
            from the partner.
        claimedByEmail:
          type: string
          nullable: true
          description: Email of the customer who claimed the organization, if claimed.
        claimedAt:
          type: string
          format: date-time
          nullable: true
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    CreatePartnerOrgResponse:
      type: object
      description: >-
        Returned once when an organization is created. These tokens are never
        shown again.
      properties:
        organizationId:
          type: string
        projectId:
          type: string
        orgApiKey:
          type: string
          description: Organization-scoped API key (`oc_org_…`).
        projectApiKey:
          type: string
          description: Project-scoped API key for the default project.
        agentToken:
          type: string
          description: Access token for the default agent.
        claimUrl:
          type: string
          description: Link the customer opens to claim ownership.
    RotateTokensResponse:
      type: object
      properties:
        orgApiKey:
          type: string
        projectApiKey:
          type: string
    PartnerMember:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - owner
            - admin
            - member
          description: >-
            `owner` (one per partner, set at creation), `admin` (manages
            members), or `member`.
        createdAt:
          type: string
          format: date-time
    Budget:
      type: object
      properties:
        secretId:
          type: string
          description: The partner LLM key this budget caps.
        organizationId:
          type: string
        limitCents:
          type: integer
          description: Spend ceiling in US cents (e.g. `500` = $5.00).
          example: 500
        period:
          type: string
          enum:
            - monthly
            - total
        spentCents:
          type: integer
          description: >-
            Spend so far this period, in US cents. Updates within a few seconds
            of usage.
          example: 320
    ClaimLinkResponse:
      type: object
      properties:
        claimUrl:
          type: string
    PartnerLinkStatus:
      type: object
      properties:
        partnerManaged:
          type: boolean
          description: True if the organization was created by a partner.
        detached:
          type: boolean
          description: True if the organization has detached from its partner.
    ProvisionResult:
      type: object
      description: >-
        Returned once when a user is provisioned. The API key is shown only
        here.
      properties:
        id:
          type: string
          description: Provision record ID.
        userId:
          type: string
          description: Placeholder user ID (becomes the real user after the claim).
        projectId:
          type: string
          description: Pre-created project ID.
        apiKey:
          type: string
          description: Project-scoped API key (`oc_…`), usable immediately.
        claimUrl:
          type: string
          description: Link the user opens to claim the account.
        expiresAt:
          type: string
          format: date-time
          description: When the unclaimed provision expires (7 days from creation).
  parameters:
    agentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
    secretId:
      name: secretId
      in: path
      required: true
      schema:
        type: string
    ruleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
    provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
      description: App provider identifier (e.g., `gmail`, `github`, `jira`)
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    connectionId:
      name: connectionId
      in: path
      required: true
      schema:
        type: string
    providerQuery:
      name: provider
      in: query
      required: false
      schema:
        type: string
      description: Filter results to a single provider (e.g. `gmail`, `github`)
    blocklistRuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
      description: Blocklist rule ID (from the blocklist state's `ruleId` field)
    orgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
      description: ID of a partner member (the user).
tags:
  - name: Agents
    description: Manage agents and their access tokens, secrets, and configuration.
  - name: Secrets
    description: Manage credentials that the gateway injects into outbound requests.
  - name: Rules
    description: >-
      Manage policy rules that control how agents interact with external
      services.
  - name: Approvals
    description: >-
      Long-poll for pending manual-approval requests and submit approve/deny
      decisions.
  - name: User
    description: Manage your user profile and API keys.
  - name: Projects
    description: >-
      Manage projects within your organization. Requires admin role for
      create/update and owner role for delete. Cloud only.
  - name: Team
    description: Provision team members programmatically. Requires admin role. Cloud only.
  - name: Apps
    description: >-
      Manage app connections (OAuth and direct credentials), BYOC configuration,
      permission catalogs, and blocklists.
  - name: Connections
    description: App connections as a top-level resource.
  - name: Utility
    description: Health check and project resource summaries.
  - name: Agent Setup
    description: >-
      Endpoints agents and orchestrators use to bootstrap gateway access
      (container config, credential stubs, gateway skill).
  - name: Migration
    description: Migrate data from a self-hosted instance to OneCLI Cloud.
  - name: Organization Settings
    description: >-
      Organization-wide policy settings. Available on OneCLI Cloud and
      self-hosted Enterprise.
  - name: Organization Secrets
    description: >-
      Manage secrets at the organization level. Organization secrets apply
      across all projects. Available on OneCLI Cloud and self-hosted Enterprise.
  - name: Organization Rules
    description: >-
      Manage policy rules at the organization level. Organization rules apply
      across all projects. Available on OneCLI Cloud and self-hosted Enterprise.
  - name: Organization Connections
    description: >-
      Manage app connections at the organization level. Available on OneCLI
      Cloud and self-hosted Enterprise.
  - name: Organization App Config
    description: >-
      Connect apps (OAuth and direct credentials) and manage BYOC app
      configuration at the organization level. Available on OneCLI Cloud and
      self-hosted Enterprise.
  - name: Organization Approvals
    description: >-
      Long-poll for manual-approval requests across every project in the
      organization. Available on OneCLI Cloud and self-hosted Enterprise.
  - name: Partner Organizations
    description: >-
      Create and manage customer organizations as a partner. Requires a Partner
      API key. Cloud only.
  - name: Partner Projects
    description: Manage projects within an unclaimed partner organization. Cloud only.
  - name: Partner Secrets
    description: >-
      Manage partner-level secrets inherited by every organization you manage.
      Cloud only.
  - name: Partner Budgets
    description: >-
      Cap how much an organization can spend on a partner LLM key. Owner or
      admin only. Cloud only.
  - name: Partner Members
    description: >-
      Manage who can sign in to your partner portal. Owner or admin only. Cloud
      only.
  - name: Organization Partner
    description: Inspect and detach an organization's partner relationship. Cloud only.
paths:
  /agents:
    get:
      operationId: listAgents
      summary: List agents
      description: >-
        Returns all agents in the current project with secret and connection
        counts.
      tags:
        - Agents
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createAgent
      summary: Create an agent
      description: >
        Creates a new agent in the current project. The identifier must be
        lowercase alphanumeric with hyphens, starting with a letter or number
        (max 50 chars).


        The response does not include the agent's access token — read it from
        `GET /agents` or regenerate it with `POST
        /agents/{agentId}/regenerate-token`.
      tags:
        - Agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - identifier
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Display name for the agent
                  example: Claude Assistant
                identifier:
                  type: string
                  pattern: ^[a-z0-9][a-z0-9-]{0,49}$
                  description: Unique identifier (lowercase, alphanumeric, hyphens)
                  example: claude-assistant
                parentIdentifier:
                  type: string
                  pattern: ^[a-z0-9][a-z0-9-]{0,49}$
                  description: >-
                    Identifier of a parent agent. The new agent inherits the
                    parent's secret mode, secret assignments, and app-connection
                    assignments.
                  example: orchestrator
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  identifier:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Agent with this identifier already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /agents/default:
