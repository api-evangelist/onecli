            application/json:
              schema:
                type: object
                properties:
                  policyMode:
                    type: string
                    enum:
                      - allow
                      - deny
                    description: >-
                      `allow` — default-allow: requests pass unless a rule
                      blocks them. `deny` — lockdown default-deny: requests are
                      blocked unless a rule allows them.
    patch:
      operationId: updateOrgSettings
      summary: Update organization settings
      description: >-
        Updates the organization's policy mode. Requires admin role. Available
        on OneCLI Cloud and self-hosted Enterprise.
      tags:
        - Organization Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - policyMode
              properties:
                policyMode:
                  type: string
                  enum:
                    - allow
                    - deny
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  policyMode:
                    type: string
                    enum:
                      - allow
                      - deny
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/orgs:
    get:
      operationId: listPartnerOrgs
      summary: List partner organizations
      description: >-
        Returns all organizations created by your partner account, including
        each one's claim status. Requires a Partner API key (`oc_partner_…`).
      tags:
        - Partner Organizations
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartnerOrg'
    post:
      operationId: createPartnerOrg
      summary: Create an organization
      description: >
        Creates an organization for a customer, with a default project, an
        organization-scoped API key, a project-scoped API key, a default agent
        token, and a claim link.


        These tokens are returned **once** in this response and are never shown
        again — store them when you create the organization.
      tags:
        - Partner Organizations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Acme Corp
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePartnerOrgResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/orgs/{orgId}:
    get:
      operationId: getPartnerOrg
      summary: Get an organization
      description: >-
        Returns a single organization you manage, including its claim status and
        projects.
      tags:
        - Partner Organizations
      parameters:
        - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerOrg'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deletePartnerOrg
      summary: Delete an unclaimed organization
      description: >-
        Permanently deletes an organization and all of its content. Only allowed
        while the organization is unclaimed.
      tags:
        - Partner Organizations
      parameters:
        - $ref: '#/components/parameters/orgId'
      responses:
        '204':
          description: Organization deleted
        '403':
          description: Organization has already been claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/orgs/{orgId}/claim-link:
    post:
      operationId: reissuePartnerClaimLink
      summary: Reissue a claim link
      description: >-
        Generates a new claim link for an unclaimed organization, invalidating
        the previous one. Only allowed while the organization is unclaimed.
      tags:
        - Partner Organizations
      parameters:
        - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          description: New claim link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimLinkResponse'
        '403':
          description: Organization has already been claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/orgs/{orgId}/rotate-tokens:
    post:
      operationId: rotatePartnerOrgTokens
      summary: Rotate organization tokens
      description: >-
        Mints a new organization-scoped API key and default project API key for
        an unclaimed organization. The previous keys stop working immediately.
      tags:
        - Partner Organizations
      parameters:
        - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateTokensResponse'
        '403':
          description: Organization has already been claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/orgs/{orgId}/projects:
    get:
      operationId: listPartnerProjects
      summary: List projects
      description: Returns the projects in an organization you manage.
      tags:
        - Partner Projects
      parameters:
        - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createPartnerProject
      summary: Create a project
      description: Adds a project to an unclaimed organization.
      tags:
        - Partner Projects
      parameters:
        - $ref: '#/components/parameters/orgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 50
                  example: Staging
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/orgs/{orgId}/projects/{projectId}:
    delete:
      operationId: deletePartnerProject
      summary: Delete a project
      description: >-
        Removes a project from an unclaimed organization. An organization must
        keep at least one project.
      tags:
        - Partner Projects
      parameters:
        - $ref: '#/components/parameters/orgId'
        - $ref: '#/components/parameters/projectId'
      responses:
        '204':
          description: Project deleted
        '400':
          description: Cannot delete the only project in the organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Organization or project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/secrets:
    get:
      operationId: listPartnerSecrets
      summary: List partner secrets
      description: >-
        Returns the partner-level secrets inherited by every organization you
        manage. Secret values are never returned.
      tags:
        - Partner Secrets
      responses:
        '200':
          description: List of secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Secret'
    post:
      operationId: createPartnerSecret
      summary: Create a partner secret
      description: >
        Creates a partner-level secret inherited by every organization you
        manage. Partner secrets are the lowest-priority tier — project and
        organization secrets override them when host patterns overlap.
      tags:
        - Partner Secrets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
                - value
                - hostPattern
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Fallback Anthropic key
                type:
                  type: string
                  enum:
                    - anthropic
                    - openai
                    - generic
                value:
                  type: string
                  minLength: 1
                  maxLength: 10000
                  description: The secret value (API key, token, etc.)
                hostPattern:
                  type: string
                  description: Hostname pattern to match (no `://`, `/`, or spaces)
                  example: api.anthropic.com
                pathPattern:
                  type: string
                  maxLength: 1000
                  description: Optional path pattern to match
                injectionConfig:
                  $ref: '#/components/schemas/InjectionConfig'
      responses:
        '201':
          description: Secret created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretCreated'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/secrets/{secretId}:
    patch:
      operationId: updatePartnerSecret
      summary: Update a partner secret
      description: >-
        Updates one or more fields on a partner secret. At least one field must
        be provided.
      tags:
        - Partner Secrets
      parameters:
        - $ref: '#/components/parameters/secretId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                value:
                  type: string
                  minLength: 1
                  maxLength: 10000
                hostPattern:
                  type: string
                pathPattern:
                  type: string
                  nullable: true
                injectionConfig:
                  $ref: '#/components/schemas/InjectionConfig'
      responses:
        '200':
          description: Secret updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Validation error or no fields provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deletePartnerSecret
      summary: Delete a partner secret
      tags:
        - Partner Secrets
      parameters:
        - $ref: '#/components/parameters/secretId'
      responses:
        '204':
          description: Secret deleted
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/orgs/{orgId}/budgets:
    get:
      operationId: listPartnerOrgBudgets
      summary: List spend budgets for an organization
      description: >-
        Returns the spend budgets set on your LLM keys for one organization,
        each with its current-period spend. Requires a Partner API key
        (`oc_partner_…`).
      tags:
        - Partner Budgets
      parameters:
        - $ref: '#/components/parameters/orgId'
      responses:
        '200':
          description: List of budgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Budget'
        '404':
          description: Organization not found for this partner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/orgs/{orgId}/secrets/{secretId}/budget:
    post:
      operationId: setPartnerOrgBudget
      summary: Set or update a spend budget
      description: >
        Caps how much an organization can spend on one of your LLM keys. When
        the organization's spend reaches the limit, the gateway stops using that
        key for the organization until the budget is raised or reset. Creates
        the budget, or replaces the existing one.


        Only partner owners and admins can set budgets, and budgets are
        supported on metered LLM keys (Anthropic today).
      tags:
        - Partner Budgets
      parameters:
        - $ref: '#/components/parameters/orgId'
        - $ref: '#/components/parameters/secretId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - limitCents
                - period
              properties:
                limitCents:
                  type: integer
                  minimum: 1
                  maximum: 100000000
                  description: Spend ceiling in US cents (e.g. `500` = $5.00).
                  example: 500
                period:
                  type: string
                  enum:
                    - monthly
                    - total
                  description: >-
                    `monthly` resets on the 1st of each month (UTC); `total` is
                    a one-time lifetime cap.
      responses:
        '200':
          description: Budget saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          description: Validation error, or the secret type isn't supported for budgets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is not a partner owner or admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Organization or secret not found for this partner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: clearPartnerOrgBudget
      summary: Remove a spend budget
      description: >-
        Removes the spend budget for an organization on one of your LLM keys.
        The key resumes with no cap for that organization. Only partner owners
        and admins can do this.
      tags:
        - Partner Budgets
      parameters:
        - $ref: '#/components/parameters/orgId'
        - $ref: '#/components/parameters/secretId'
      responses:
        '204':
          description: Budget removed
        '403':
          description: Caller is not a partner owner or admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Organization or secret not found for this partner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/members:
    get:
      operationId: listPartnerMembers
      summary: List partner members
      description: >-
        Returns the people who can sign in to your partner portal. Requires a
        Partner API key (`oc_partner_…`) or a partner portal session.
      tags:
        - Partner Members
      responses:
        '200':
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartnerMember'
    post:
      operationId: addPartnerMember
      summary: Add a partner member
      description: >
        Adds a member to your partner by email; they sign in to the portal with
        that email. Only owners and admins can add members. The assignable roles
        are `admin` and `member` — the owner role is set at partner creation and
        can't be granted.
      tags:
        - Partner Members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - role
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                  example: teammate@acme.com
                role:
                  type: string
                  enum:
                    - admin
                    - member
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerMember'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is not a partner owner or admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A member with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/members/{userId}/role:
    patch:
      operationId: changePartnerMemberRole
      summary: Change a member's role
      description: >-
        Moves a member between `admin` and `member`. Only owners and admins can
        do this, and the owner's role can't be changed.
      tags:
        - Partner Members
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum:
                    - admin
                    - member
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is not a partner owner or admin, or the target is the owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /partner/members/{userId}:
    delete:
      operationId: removePartnerMember
      summary: Remove a partner member
      description: >-
        Removes a member from your partner. Only owners and admins can do this,
        and the owner can't be removed.
      tags:
        - Partner Members
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: Member removed
        '403':
          description: Caller is not a partner owner or admin, or the target is the owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /org/partner/inherited-secrets:
    get:
      operationId: listInheritedPartnerSecrets
      summary: List inherited partner secrets
      description: >-
        Returns the partner-level secrets this organization inherits
        (read-only). Empty if the organization has no partner or has detached.
        Authenticate with your organization API key or session.
      tags:
        - Organization Partner
      responses:
        '200':
          description: List of inherited secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Secret'
  /org/partner/status:
    get:
      operationId: getPartnerStatus
      summary: Get partner status
      description: >-
        Returns whether this organization is managed by a partner and whether it
        has detached. Requires the admin or owner role.
      tags:
        - Organization Partner
      responses:
        '200':
          description: Partner link status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerLinkStatus'
  /org/partner/detach:
    post:
      operationId: detachFromPartner
      summary: Detach from partner
      description: >-
        Stops this organization from inheriting partner secrets while keeping
        its partner attribution. Requires the admin or owner role.
      tags:
        - Organization Partner
      responses:
        '200':
          description: Detached
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Organization is not managed by a partner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions (requires admin role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
