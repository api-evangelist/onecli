  /org/apps/{provider}/authorize:
    get:
      operationId: authorizeOrgApp
      summary: Start organization OAuth flow
      description: >
        Starts an OAuth flow that creates the connection at the organization
        level, shared by every project in the organization. Redirects to the
        app's OAuth authorization page; the flow completes on the shared
        `/apps/{provider}/callback` endpoint, so no extra redirect URI
        registration is needed.


        Typically opened in a browser. With an organization API key the target
        organization is derived from the key. Available on OneCLI Cloud and
        self-hosted Enterprise. Requires the admin or owner role.
      tags:
        - Organization App Config
      parameters:
        - $ref: '#/components/parameters/provider'
        - name: connectionId
          in: query
          schema:
            type: string
          description: >-
            Reconnect an existing organization connection instead of creating a
            new one
        - name: org
          in: query
          schema:
            type: string
          description: >-
            Target organization ID when the caller belongs to several
            organizations. Defaults to the organization derived from the
            credentials.
      responses:
        '302':
          description: Redirect to OAuth provider
        '400':
          description: Provider not available or not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient role or not a member of the target organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /org/apps/{provider}/connect:
    post:
      operationId: connectOrgApp
      summary: Connect app at the organization level
      description: >-
        Connects an app using direct credentials (API key, service account,
        etc.) at the organization level. The connection is shared by every
        project in the organization. Available on OneCLI Cloud and self-hosted
        Enterprise. Requires admin role.
      tags:
        - Organization App Config
      parameters:
        - $ref: '#/components/parameters/provider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fields
              properties:
                fields:
                  type: object
                  additionalProperties:
                    type: string
                  description: Credential fields required by the app
                  example:
                    apiKey: sk-...
                connectionId:
                  type: string
                  description: Reconnect an existing connection
                label:
                  type: string
                  description: >-
                    Display label for the connection. Defaults to a label
                    derived from the credential metadata.
                method:
                  type: string
                  description: >-
                    Connection method to use for apps with multiple methods
                    (e.g. OAuth primary + API-key alternate). An unrecognized
                    value is rejected.
      responses:
        '200':
          description: Connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Validation error or provider not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient role or not a member of the organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
